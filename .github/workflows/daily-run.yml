# runs the pipeline every day and saves the new signals
name: Daily run

on:
  schedule:
    - cron: "0 15 * * *"  # 8am arizona time
  workflow_dispatch:      # lets me run it by clicking a button

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python save_trends.py

      - name: Save the csv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trends_log.csv
          git commit -m "daily update" || echo "nothing new"
          git push
